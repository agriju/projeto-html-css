<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login | Projeto Desafio</title>
</head>

<body>
<!-- INICIO CONTAINER -->
    <main class="container">

<!-- INICIO DO BLOCO ESQUERDO -->
        <section class="lado-esquerdo">
            <h1>Minha conta</h1>

            <form class="form">
                <input class="input" type="email" placeholder="Digite seu email">
                
                <input class="input" type="password" placeholder="Digite sua senha">
                        
                <button class="button" type="submit">Acessar</button>
            </form>

            <div class="area">
                <span class="link">Novo por aqui? <a href="signup.html">Cadastre-se.</a> </span>
            </div>
        </section>
<!-- FIM DO BLOCO ESQUERDO -->

<!-- INICIO DO BLOCO DIREITO -->
        <section class="lado-direito">

            <div class="img-codigos">
                <img src="assets/info.png" alt="imagem codigos">
            </div>

            <div class="main-text">
                <h2 class="subtitle">Leve sua carreira ao próximo nível</h2>
                <p class="description">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Velit aut, fugiat tempora iste suscipit impedit rem quibusdam nobis consequuntur, amet, vel minima? Nulla dolorem, tenetur modi cum possimus quas rem.
                </p>
            </div>

        </section>
<!-- FIM DO BLOCO DIREITO -->

    </main>
<!-- FIM DO CONTAINER -->

</body>

</html>
